# Development tooling only; the plugins themselves have no Python dependencies.
[project]
name = "agent-plugins-dev"
version = "0"
requires-python = ">=3.11"

[dependency-groups]
dev = ["ruff==0.17.3", "zizmor==1.32.0"]

[tool.uv]
package = false
# uv 0.10+ reads the relative exclude-newer below.
required-version = ">=0.10.0"
# Release-age cooldown for versions uv resolves. `uv sync --locked` installs the lock as is,
# so CI also runs scripts/check_release_age.py on the versions a PR adds.
exclude-newer = "6 days"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# Long lines in the scripts are skill text that must match the skills word for word.
ignore = ["E501"]
